<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vinayak Dubey is an independent full-stack developer and software engineer building custom business software, ecommerce platforms, AI-powered tools, and operational systems." />
    <meta name="theme-color" content="#14161b" />
    <script>
      (() => {
        const key = "vinayak-theme";
        let storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem(key);
        } catch {
          storedTheme = null;
        }
        const theme = storedTheme === "dark" || storedTheme === "light" ? storedTheme : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#14161b" : "#f5f2ea");
      })();
    </script>
    <meta property="og:title" content="Vinayak Dubey — Full-Stack Developer & Software Engineer" />
    <meta property="og:description" content="Custom business software, ecommerce platforms, AI-powered tools, and operational systems." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vinayakdubey.com/" />
    <link rel="canonical" href="https://vinayakdubey.com/" />
    <title>Vinayak Dubey — Full-Stack Developer &amp; Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="project-type" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
